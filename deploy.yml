# .github/workflows/deploy.yml
# baseball_dashboard.py を定期実行してHTMLを生成し、GitHub Pages で公開します。
# 事前準備:
#   1) リポジトリに baseball_dashboard.py を置く
#   2) Settings > Secrets and variables > Actions で DEEPL_API_KEY を登録（任意）
#   3) Settings > Pages で「Source: GitHub Actions」を選択
name: build-baseball-dashboard

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST（UTC 22:00）。好みで変更可
  workflow_dispatch: {}     # 手動実行ボタンも付く

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser requests pandas lxml

      - name: Build dashboard
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python baseball_dashboard.py
          mkdir -p _site
          cp baseball_dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
